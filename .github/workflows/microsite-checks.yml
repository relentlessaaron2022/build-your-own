name: Microsite source checks
on:
  pull_request:
    paths: ['microsites/**', '.github/workflows/microsite-checks.yml']
  push:
    paths: ['microsites/**', '.github/workflows/microsite-checks.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check microsites/sites/art-gallery/dist/assets/gallery.js
      - run: node microsites/sites/art-gallery/build.mjs
      - run: git diff --exit-code -- microsites/sites/art-gallery/dist
      - run: python microsites/scripts/check_sites.py
