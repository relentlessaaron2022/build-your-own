name: Pinterest Autopilot tests
on:
  pull_request:
    paths:
      - 'relentless-pinterest-autopilot/**'
      - '.github/workflows/pinterest-tests.yml'
  push:
    paths:
      - 'relentless-pinterest-autopilot/**'
      - '.github/workflows/pinterest-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relentless-pinterest-autopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . -r requirements-dev.txt
      - run: pytest tests -q
