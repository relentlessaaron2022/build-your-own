[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relentless-pinterest-autopilot"
version = "0.1.0"
description = "Automated Pinterest marketing engine for Relentless Aaron"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "click>=8.1,<9.0",
    "python-dotenv>=1.0,<2.0",
    "Pillow>=10.0,<11.0",
    "requests>=2.31,<3.0",
    "APScheduler>=3.10,<4.0",
    "feedparser>=6.0,<7.0",
    "Flask>=3.0,<4.0",
]

[project.scripts]
pinterest = "app.cli:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.reporting" = ["templates/*.html"]
