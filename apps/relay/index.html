<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Relay</title>
<link rel="stylesheet" href="../../kit/bama.css">
<style>
  .macro-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex: none; }
  .macro-row .dot.on { background: var(--ok); }
  .macro-row .dot.run { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .editor { flex: 1; overflow: auto; padding: 20px 24px 40px; }
  .editor-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .name-input { font-size: 22px; font-weight: 650; border: 0; background: transparent; outline: none; width: 100%; }
  .trigger { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .step { display: flex; gap: 12px; }
  .step .num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; flex: none; margin-top: 10px; font-size: 12px; }
  .step .card { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .step.off .card { opacity: .5; }
  .step .head { display: flex; align-items: center; gap: 6px; }
  .step .head strong { flex: 1; }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .fields .wide { grid-column: 1 / -1; }
  .connector { width: 2px; height: 14px; background: var(--line-2); margin-left: 12px; }
  .plan { font: 12px var(--mono); max-height: 200px; overflow: auto; background: var(--panel-2); border-radius: 6px; padding: 8px; }
  .plan .bad { color: var(--bad); }
  .log { height: 180px; flex: none; border-top: 1px solid var(--line); background: var(--bg-2); display: flex; flex-direction: column; }
  .log pre { flex: 1; margin: 0; overflow: auto; padding: 6px 12px; font: 11.5px/1.6 var(--mono); user-select: text; white-space: pre-wrap; }
  .log .error { color: var(--bad); } .log .ok { color: var(--ok); } .log .warn { color: var(--warn); }
  .problem { color: var(--bad); font-size: 12px; }
</style>
</head>
<body data-app="relay">
<div class="app">
  <div class="titlebar"><span class="brand">Re<b>lay</b></span><span class="faint">Automations for your Mac</span><span class="spacer"></span>
    <button class="btn sm" id="fromTemplate">＋ From template</button>
    <button class="btn sm primary" id="newMacro">＋ New macro</button>
  </div>
  <div class="body">
    <aside class="sidebar"><div class="section-label">Macros</div><ul class="list scroll grow" id="macroList"></ul></aside>
    <main class="main">
      <div class="editor" id="editor"></div>
      <div class="log"><div class="toolbar"><strong>Run log</strong><span class="spacer"></span><button class="btn sm ghost" id="clearLog">Clear</button></div><pre id="log"></pre></div>
    </main>
  </div>
</div>
<script src="../../kit/bama.js"></script>
<script src="catalog.js"></script>
<script src="renderer.js"></script>
</body>
</html>
