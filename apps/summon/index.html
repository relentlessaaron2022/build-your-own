<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Summon</title>
<link rel="stylesheet" href="../../kit/bama.css">
<style>
  body { background: transparent; }
  .palette { height: 100vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; overflow: hidden; }
  .search { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
  .search input { flex: 1; border: 0; outline: none; background: transparent; font-size: 20px; -webkit-app-region: no-drag; }
  .search .bolt { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; }
  .modes { display: flex; gap: 4px; -webkit-app-region: no-drag; }
  .modes button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 2px 10px; font-size: 11.5px; color: var(--text-2); }
  .modes button.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  #results { flex: 1; overflow: auto; padding: 6px; }
  .group { margin: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; min-height: 40px; }
  .item.sel { background: var(--accent-soft); }
  .item .ic { width: 26px; height: 26px; flex: none; border-radius: 6px; display: grid; place-items: center; background: var(--panel-2); font-size: 14px; overflow: hidden; }
  .item .ic img { width: 26px; height: 26px; }
  .item .t { flex: 1; min-width: 0; }
  .item .t div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .sub { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .kind { font-size: 11px; color: var(--text-3); }
  .calc { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .foot { display: flex; gap: 14px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 11.5px; background: var(--bg-2); }
  .foot .grow { flex: 1; }
  .manage { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body data-app="summon">
  <div class="palette">
    <div class="search">
      <div class="bolt">S</div>
      <input id="q" placeholder="Search apps, files, commands…  try 12*8, clip, snip" autofocus spellcheck="false">
      <div class="modes" id="modes">
        <button data-mode="all" class="active">All</button>
        <button data-mode="clip">Clipboard</button>
        <button data-mode="snip">Snippets</button>
        <button data-mode="links">Quicklinks</button>
      </div>
    </div>
    <div id="results"></div>
    <div class="foot">
      <span><span class="kbd">↵</span> open</span>
      <span><span class="kbd">⌘</span><span class="kbd">↵</span> reveal / copy</span>
      <span><span class="kbd">⇥</span> switch mode</span>
      <span class="grow"></span>
      <span id="footHint"></span>
      <button class="btn ghost sm" id="addBtn">＋ New</button>
    </div>
  </div>
  <script src="../../kit/bama.js"></script>
  <script src="lib.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
