<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; script-src 'self'">
<title>Forge</title>
<link rel="stylesheet" href="../../kit/bama.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-app="forge">
<div class="app">
  <div class="titlebar">
    <span class="brand">For<b>ge</b></span>
    <button class="btn sm" id="openFolder">Open folder…</button>
    <span class="faint" id="folderName"></span>
    <span class="spacer"></span>
    <button class="btn sm" id="quickOpen" title="Go to file (⌘P)">Go to file <span class="kbd">⌘P</span></button>
    <button class="btn sm" id="toggleRun" title="Run panel (⌘J)">Run <span class="kbd">⌘J</span></button>
    <button class="btn sm" id="toggleAi" title="Claude panel (⌘L)">Claude <span class="kbd">⌘L</span></button>
    <button class="btn sm ghost" id="settingsBtn" title="Settings">⚙︎</button>
  </div>
  <div class="body">
    <aside class="sidebar">
      <div class="tabs"><button class="active" data-side="files">Files</button><button data-side="search">Search</button></div>
      <div class="scroll grow" id="sideFiles"></div>
      <div class="grow col hidden" id="sideSearch" style="min-height:0">
        <div style="padding:8px" class="col">
          <input class="input" id="searchQ" placeholder="Search in project…" spellcheck="false">
          <div class="row"><label class="check"><input type="checkbox" id="searchRe"> Regex</label><label class="check"><input type="checkbox" id="searchCase"> Match case</label></div>
        </div>
        <div class="scroll grow" id="searchResults"></div>
      </div>
    </aside>
    <main class="main">
      <div class="filetabs" id="filetabs"></div>
      <div class="editor-area">
        <div id="editor"></div>
        <div id="welcome" class="empty">
          <h3>Open a folder to start</h3>
          <p>Forge edits real files on your Mac. Select code and press <span class="kbd">⌘K</span> to tell Claude what to change. Press <span class="kbd">⌘L</span> to ask about anything.</p>
          <button class="btn primary" id="welcomeOpen">Open folder…</button>
        </div>
        <div class="kbar hidden" id="kbar">
          <span class="pill accent">⌘K</span>
          <input class="input grow" id="kInput" placeholder="Describe the change: add error handling, make it async, rename to…">
          <button class="btn sm primary" id="kGo">Generate</button>
          <button class="btn sm" id="kClose">Esc</button>
        </div>
        <div class="diffbar hidden" id="diffbar">
          <strong>Review change</strong><span class="faint" id="diffNote"></span><span class="spacer"></span>
          <button class="btn sm" id="diffReject">Reject</button>
          <button class="btn sm primary" id="diffAccept">Accept <span class="kbd">⌘↵</span></button>
        </div>
        <div id="diffEditor" class="hidden"></div>
      </div>
      <div class="runpanel hidden" id="runpanel">
        <div class="toolbar">
          <span class="faint">$</span>
          <input class="input grow mono" id="runCmd" placeholder="npm run dev · python3 app.py · git status" spellcheck="false">
          <button class="btn sm primary" id="runGo">Run</button>
          <button class="btn sm" id="runStop">Stop</button>
          <button class="btn sm ghost" id="runClear">Clear</button>
          <button class="btn sm ghost" id="runExplain" title="Ask Claude about this output">Explain output</button>
        </div>
        <pre class="runout" id="runOut"></pre>
      </div>
    </main>
    <aside class="aipanel" id="aipanel">
      <div class="toolbar">
        <strong>Claude</strong><span class="spacer"></span>
        <select class="select" id="effort" title="How hard Claude thinks" style="height:24px;font-size:12px">
          <option value="low">Quick</option><option value="medium">Balanced</option><option value="high" selected>Thorough</option><option value="xhigh">Deep</option>
        </select>
        <button class="btn sm ghost" id="aiNew" title="New conversation">New</button>
      </div>
      <div class="scroll grow" id="chat"></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <textarea class="textarea" id="aiInput" rows="3" placeholder="Ask about this file, paste an error, or plan a feature.  ↵ send · ⇧↵ new line"></textarea>
        <div class="row"><label class="check"><input type="checkbox" id="ctxFile" checked> Current file</label><label class="check"><input type="checkbox" id="ctxOpen"> All open tabs</label><span class="spacer"></span><button class="btn sm primary" id="aiSend">Send</button></div>
      </div>
    </aside>
  </div>
  <div class="statusbar" id="status"></div>
</div>
<script src="../../kit/bama.js"></script>
<script src="../../node_modules/monaco-editor/min/vs/loader.js"></script>
<script src="renderer.js"></script>
</body>
</html>
